; USE THE LOCALIZATION DASHBOARD IN THE UNREAL EDITOR TO EDIT THE CONFIGURATION
[CommonSettings]
SourcePath=Plugins/Odyssey/Content/Localization/Epos
DestinationPath=Plugins/Odyssey/Content/Localization/Epos
ManifestName=Epos.manifest
ArchiveName=Epos.archive
ResourceName=Epos.locres
PortableObjectName=Epos.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=fr
CulturesToGenerate=ja

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/Odyssey/Source/Epos*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

; ; This will export all properties/enum/struct/class/... types
; ; To customize export:
; ; - maybe make multiple GatherTextStepX with different IncludePathFilters with custom FieldTypesToInclude for each ?
; ; - or list all FieldOwnerTypesToInclude ? or maybe just FieldOwnerTypesToExclude ?
; ;
; ; And don't forget to update the next GatherTextStepX index !!!
; ;
; ; And below, there is the list of:
; ; - all the available FieldTypesToInclude/Exclude values (~100)
; ; - all the available FieldOwnerTypesToInclude/Include values (~7000+5000)
; ; (the list is valid at 2024.06.13)
; ;
; ; To debug the GatherTextFromMetadata commandlet, in visual studio, add those parameters:
; ; - "" -run=GatherText -config="E:\work-odyssey\Odyssey-5.4\Engine\Plugins\Odyssey\Config\Localization\Odyssey.ini" -SCCProvider=None -Unattended -NoShaderCompile
; ; - set a breakpoint in commandlet
; ;
; ; (This part was inspired by ini files in ...\Engine\Config\Localization\*.ini)
; ;
; [GatherTextStep1]
; CommandletClass=GatherTextFromMetadata
; ModulesToPreload=OutputLog
; ModulesToPreload=StructViewer
; ModulesToPreload=MeshPaintMode
; ModulesToPreload=LandscapeEditor
; IncludePathFilters=Plugins/Epos/Source/*
; ; IncludePathFilters=Plugins/Epos/Source/EposNamingConvention/*
; ExcludePathFilters=Plugins/Epos/Source/Config/Localization/*
;
; FieldTypesToInclude=Property
; FieldTypesToInclude=Enum
; ; FieldTypesToInclude=Struct ; this implies class/function/...
; FieldTypesToInclude=ScriptStruct
; ; FieldOwnerTypesToInclude=DeveloperSettings
; ; FieldOwnerTypesToInclude=*Settings
;
; InputKeys=DisplayName
; OutputNamespaces=UObjectDisplayNames
; OutputKeys="{FieldPath}"
; InputKeys=Category
; OutputNamespaces=UObjectCategory
; OutputKeys="{MetaDataValue}"
; InputKeys=ToolTip
; OutputNamespaces=UObjectToolTips
; OutputKeys="{FieldPath}"
; InputKeys=ShortTooltip
; OutputNamespaces=UObjectShortTooltips
; OutputKeys="{FieldPath}"
; ShouldGatherFromEditorOnlyData=true

; [GatherTextStep2]
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

; [GatherTextStep3]
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

; [GatherTextStep4]
[GatherTextStep3]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Odyssey.csv
bConflictReport=true
ConflictReportName=Odyssey_Conflicts.txt


; [GatherTextStep5]
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
POFormat=EPortableObjectFormat::Unreal


; [GatherTextStep6]
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource


; [GatherTextStep7]
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
POFormat=EPortableObjectFormat::Unreal
ShouldPersistCommentsOnExport=false
ShouldAddSourceLocationsAsComments=true

