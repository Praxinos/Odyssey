;---
;---

[CoreRedirects]
+PackageRedirects=(OldName="/Iliad/...",NewName="/Odyssey/", MatchWildcard=true)
+PackageRedirects=(OldName="/Epos/...",NewName="/Odyssey/", MatchWildcard=true)

;LayerStack
+ClassRedirects=(OldName="OdysseyLayerStack", NewName="/Script/OdysseyLayerStack.OdysseyLayerStack")
+ClassRedirects=(OldName="OdysseyLayerRoot", NewName="/Script/OdysseyLayerStack.OdysseyLayerRoot")
+ClassRedirects=(OldName="OdysseyLayer", NewName="/Script/OdysseyLayerStack.OdysseyLayer")

; Animation
+ClassRedirects=(OldName="OdysseyAnimationLayerRoot", NewName="/Script/OdysseyLayerStack.OdysseyLayerRoot")
+ClassRedirects=(OldName="/Script/OdysseyLayerStackEditor.OdysseyAnimationLayer...", NewName="/Script/OdysseyAnimation.OdysseyAnimationLayer", MatchWildcard=true)
+ClassRedirects=(OldName="/Script/OdysseyLayerStackEditor.OdysseyAnimationCell...", NewName="/Script/OdysseyAnimation.OdysseyAnimationCell", MatchWildcard=true)

; Texture

; We don't redirect OdysseyTextureAssetUserData because it contained the old non UObject layerstack, which is now impossible to load anymore
; Activating this would create crashes on some assets
; Instead we assume those assets generates warnings about OdysseyTextureAssetUserData not existing
; If you want to get rid of those warnings, just resave the asset.
; Opening this kind of asset will just recreate a default layerstack.
; +ClassRedirects=(OldName="OdysseyTextureAssetUserData", NewName="/Script/OdysseyTexture.OdysseyTextureLayerStackUserData")

+ClassRedirects=(OldName="OdysseyTextureLayerStackUserData", NewName="/Script/OdysseyTexture.OdysseyTextureLayerStackUserData")
+ClassRedirects=(OldName="OdysseyTextureLayerStack", NewName="/Script/OdysseyTexture.OdysseyTextureLayerStack")
+ClassRedirects=(OldName="OdysseyTextureLayerRoot", NewName="/Script/OdysseyLayerStack.OdysseyLayerRoot")
+ClassRedirects=(OldName="OdysseyTextureLayerFolder", NewName="/Script/OdysseyTexture.OdysseyTextureLayerFolder")
+ClassRedirects=(OldName="OdysseyTextureLayerImageRaster", NewName="/Script/OdysseyTexture.OdysseyTextureLayerImageRaster")
+ClassRedirects=(OldName="OdysseyTextureLayerImageVector", NewName="/Script/OdysseyTexture.OdysseyTextureLayerImageVector")


; +PackageRedirects=(OldName="/Script/OdysseyShapes/...",NewName="/Odyssey/OdysseyPainterEditor/", MatchWildcard=true)
+ClassRedirects=(OldName="/Script/OdysseyShapes.OdysseyFreehandShapeOverrides",NewName="/Script/OdysseyPainterEditor.OdysseyFreehandShapeOverrides")
+EnumRedirects=(OldName="/Script/OdysseyCore.EOdysseyAlphaMode",NewName="/Script/OdysseyRendering.EOdysseyAlphaMode")
+EnumRedirects=(OldName="/Script/OdysseyCore.EOdysseyBlendingMode",NewName="/Script/OdysseyRendering.EOdysseyBlendingMode")
+EnumRedirects=(OldName="/Script/OdysseyLayerStackEditor.EOdysseyAnimationLayerImagePostBehaviour",NewName="/Script/OdysseyLayerStack.EOdysseyLayerImagePostBehaviour")
+EnumRedirects=(OldName="/Script/OdysseyLayerStackEditor.EOdysseyLayerCellImageStaggerBehaviour",NewName="/Script/OdysseyLayerStack.EOdysseyLayerCellImageStaggerBehaviour")

; Storyboard cleaning: move all assets inside directories
+PackageRedirects=(OldName="/Odyssey/S_1_Unit_Plane",NewName="/Odyssey/Meshes/S_1_Unit_Plane")
