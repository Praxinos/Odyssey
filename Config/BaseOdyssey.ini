; https://udn.unrealengine.com/s/question/0D54z00006tMlfbCAC/plugin-cconfig-how-to-use-config-ini-file-for-a-custom-plugin-
; This config file is used when the plugin is inside Engine folder (for release)
; This file will be copied (during pre-build-steps) in DefaultEpos.ini to be able to use this config when the plugin is inside a project (for development)

[/Script/EposTracksEditor.EposTracksEditorSettings]
; See BaseEngine.ini at [/Script/CinematicCamera.CineCameraComponent]
CameraSettings=(Filmback=(SensorWidth=23.76,SensorHeight=13.365),LensSettings=(MinFocalLength=4,MaxFocalLength=1000,MinFStop=1.2,MaxFStop=22,DiaphragmBladeCount=7),FocusSettings=(ManualFocusDistance=200.000000),CurrentAperture=16,CurrentFocalLength=35)
TextureSettings=(Height=1080)
DefaultSectionDuration=3.0
BoardTrackSettings=(BoardSectionColor=(R=.94,G=.39,B=.6,A=.25),ShotSectionColor=(R=.6,G=.39,B=.94,A=.25))

[/Script/EposSequenceEditor.EposSequenceEditorSettings]
; See BaseEngine.ini at [/Script/CinematicCamera.CineCameraComponent]
BoardSettings=(DefaultTickFrameRate=(Numerator=24000,Denominator=1),DefaultDisplayFrameRate=(Numerator=24,Denominator=1))
ShotSettings=(DefaultTickFrameRate=(Numerator=24000,Denominator=1),DefaultDisplayFrameRate=(Numerator=24,Denominator=1))

[/Script/EposTracks.EposTracksSettings]
BoardTrackSettings=(ArrangeSections=OnOneRow)

;---

[EposSequencerEditor SequencerSettings]
bKeyInterpPropertiesOnly=true
bShowRangeSlider=true
bKeepPlayRangeInSectionBounds=true
ZeroPadFrames=4
bInfiniteKeyAreas=true
bAutoSetTrackDefaults=true
FrameNumberDisplayFormat=Frames
KeyGroupMode=KeyAll
AutoChangeMode=AutoKey

;---
;---
;---

[OdysseyTelemetry.Config]
SendTelemetry=True

[OdysseyTelemetry.Provider]
; Enabled=False
; UsageType=EditorAndClientAndServer
UsageType=Editor
APIKeyOdyssey=OdysseyAnalytics
APIServerOdyssey="https://api.telemetry.praxinos.coop/"
APIEndpointOdyssey="v1/events"

; This is used when building a not "Development Editor" mode
; Then, all events are always send but can be filtered on the web side
; (and certainly ignored in this case)
[OdysseyTelemetry.Provider-Debug]
Enabled=False
UsageType=Editor
APIKeyOdyssey=OdysseyAnalytics.Debug
; HTTP = NOT SECURE !!!
APIServerOdyssey="http://127.0.0.1:8080/"
APIEndpointOdyssey="v1/events"

