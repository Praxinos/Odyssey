<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 256 256">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
        stroke: #fff;
        stroke-width: 20;
      }
    </style>
  </defs>

  <g id="root" class="cls-1">

    <g id="lined-rectangle">
      <rect
        id="lined-border"
        x="14"
        y="14"
        width="110"
        height="226"
        fill="none"
      />
    </g>

    <g id="dotted-rectangle">
      <rect
        id="dotted-border"
        x="140"
        y="14"
        width="106"
        height="226"
        fill="none"
        stroke-dasharray="20"
      />

      <g id="plus">
        <line
          id="plus-horizontal"
          x1="168"
          y1="122"
          x2="224"
          y2="122"
        />
        <line
          id="plus-vertical"
          x1="196"
          y1="94"
          x2="196"
          y2="150"
        />
      </g>
    </g>

  </g>

</svg>
